name: ci
on:
  pull_request: {}
  merge_group: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci event=${{ github.event_name }} sha=${{ github.sha }} ref=${{ github.ref }}"
